<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body{margin:0;padding:24px;background:#fff}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .stack{display:grid;gap:18px}
  </style>
</head><body>
<div class="stack">
  <div class="row">
    <button class="primary-button" type="button">Save recipe</button>
    <button class="secondary-button" type="button">Edit recipe</button>
    <button class="danger-button" type="button">Delete</button>
    <button class="text-button" type="button">← All recipes</button>
  </div>
  <div class="row" style="background:var(--forest);padding:16px;border-radius:var(--radius-lg)">
    <button class="light-button" type="button">Sign in with GitHub</button>
    <button class="text-button" type="button" style="color:var(--on-forest-muted)">Sign out</button>
  </div>
</div>
</body></html>
