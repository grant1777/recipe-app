<!-- @dsCard group="Components" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body{margin:0;padding:24px;background:#fff}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .stack{display:grid;gap:18px}
    .lbl{color:var(--muted);font-size:var(--text-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
  </style>
</head><body>
<div class="stack">
  <section><p class="lbl">Category &amp; stock</p><div class="row">
    <span class="category-pill">Dinner</span>
    <span class="category-pill">Drink</span>
    <span class="stock-pill">3 of 10 in stock</span>
    <span class="stock-pill is-ready">✓ Can make now</span>
  </div></section>
  <section><p class="lbl">Ingredient amounts</p>
    <ul style="margin:0;padding-left:20px;line-height:2">
      <li><span class="ingredient-measure">5</span> Potatoes</li>
      <li><span class="ingredient-measure">1 tbsp</span> Butter</li>
      <li><span class="ingredient-measure">½ cup</span> Sour cream</li>
    </ul>
  </section>
  <section><p class="lbl">Needs attention</p><div class="row">
    <span class="recipe-unlinked-alert" role="img" aria-label="1 ingredient not in your ingredient list">!</span>
  </div></section>
</div>
</body></html>
