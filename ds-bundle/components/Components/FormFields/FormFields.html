<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body{margin:0;padding:24px;background:#fff}
    .stack{display:grid;gap:16px;max-width:420px}
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  </style>
</head><body>
<div class="stack">
  <label class="field">Recipe name<input value="KFC Bowl"></label>
  <label class="field">Category<select><option>Dinner</option><option>Drink</option></select></label>
  <div class="pair">
    <label class="field">Amount<input value="5"></label>
    <label class="field">Unit<select><option>piece</option><option>cup</option><option>g</option></select></label>
  </div>
  <label class="field">Notes<textarea>Use gluten-free flour.</textarea></label>
</div>
</body></html>
