<!-- @dsCard group="Foundations" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body{margin:0;padding:24px;background:#fff}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .stack{display:grid;gap:18px}
    .lbl{color:var(--muted);font-size:var(--text-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
    .box{width:110px;height:72px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:var(--text-xs);font-weight:800;color:var(--pill-ink)}
    .lift{background:#fff;border-radius:var(--radius-lg)}
  </style>
</head><body>
<div class="stack">
  <section><p class="lbl">Radius</p><div class="row">
    <div class="box" style="border-radius:var(--radius-sm)">sm · 6</div>
    <div class="box" style="border-radius:var(--radius-md)">md · 8</div>
    <div class="box" style="border-radius:var(--radius-lg)">lg · 12</div>
    <div class="box" style="border-radius:var(--radius-xl)">xl · 14</div>
    <div class="box" style="border-radius:var(--radius-pill)">pill</div>
  </div></section>
  <section><p class="lbl">Elevation</p><div class="row" style="gap:24px;padding:8px 0 16px">
    <div class="box lift" style="box-shadow:var(--shadow-sm)">shadow-sm</div>
    <div class="box lift" style="box-shadow:var(--shadow-md)">shadow-md</div>
    <div class="box lift" style="box-shadow:var(--shadow-lg)">shadow-lg</div>
    <div class="box lift" style="border-color:var(--accent);box-shadow:var(--shadow-ready)">shadow-ready</div>
  </div></section>
  <section><p class="lbl">Spacing · space-1 to space-8</p><div class="row" style="align-items:end">
    <div style="width:var(--space-1);height:var(--space-1);background:var(--accent)"></div>
    <div style="width:var(--space-2);height:var(--space-2);background:var(--accent)"></div>
    <div style="width:var(--space-3);height:var(--space-3);background:var(--accent)"></div>
    <div style="width:var(--space-4);height:var(--space-4);background:var(--accent)"></div>
    <div style="width:var(--space-5);height:var(--space-5);background:var(--accent)"></div>
    <div style="width:var(--space-6);height:var(--space-6);background:var(--accent)"></div>
    <div style="width:var(--space-7);height:var(--space-7);background:var(--accent)"></div>
    <div style="width:var(--space-8);height:var(--space-8);background:var(--accent)"></div>
  </div></section>
</div>
</body></html>
