<!-- @dsCard group="Foundations" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body{margin:0;padding:24px;background:#fff}
    .stack{display:grid;gap:18px}
    .lbl{color:var(--muted);font-size:var(--text-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
    .sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
    .sw div{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:#fff}
    .sw i{display:block;height:56px}
    .sw b{display:block;font-size:var(--text-xs);padding:8px 10px 0}
    .sw code{display:block;color:var(--muted);font-family:var(--font-mono);font-size:var(--text-2xs);padding:2px 10px 8px}
  </style>
</head><body>
<div class="stack" id="out"></div>
<script>
  var groups = {
    "Core palette": ["ink", "muted", "line", "surface", "panel", "accent", "accent-dark", "gold", "rose", "sky"],
    "Surfaces & accents": ["card", "panel-soft", "accent-soft", "sand", "sand-hover", "sand-ink", "pill-ink", "border-hover"],
    "Sidebar & danger": ["forest", "on-forest", "on-forest-muted", "danger-soft", "danger-ink"]
  };
  var css = getComputedStyle(document.documentElement);
  document.getElementById("out").innerHTML = Object.keys(groups).map(function (title) {
    return '<section><p class="lbl">' + title.replace("&", "&amp;") + '</p><div class="sw">' + groups[title].map(function (n) {
      return '<div><i style="background:var(--' + n + ')"></i><b>--' + n + '</b><code>' + css.getPropertyValue("--" + n).trim() + '</code></div>';
    }).join("") + '</div></section>';
  }).join("");
</script>
</body></html>
